name: Build Infinite Streams Media APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Infinite Streams Media
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Tests are reported for visibility, but upstream test failures do not block APK packaging.
      - name: Run unit tests (non-blocking)
        run: ./gradlew test
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: infinite-streams-media-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
